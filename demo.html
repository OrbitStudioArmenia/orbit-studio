<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass demo</title>
<link rel="stylesheet" href="glass.css">
<script src="glass.js" defer></script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;gap:2rem;background:#f3f9ff;color:#0a2559;font:1.1rem system-ui;overflow:hidden}
  /* Стекло нужно что-то преломлять — яркие плоские фигуры за ним */
  .shape{position:fixed;border-radius:50%;z-index:-1}
  .a{width:40vmin;height:40vmin;background:#62b5e5;left:10vw;top:10vh}
  .b{width:26vmin;height:26vmin;background:#ffd23f;right:14vw;top:24vh}
  .c{width:30vmin;height:30vmin;background:#1b3f8f;left:46vw;bottom:6vh}
  h1{font-size:clamp(3rem,12vw,9rem);margin:0}
</style>
</head>
<body>
  <div class="shape a"></div><div class="shape b"></div><div class="shape c"></div>
  <h1>Orbit</h1>

  <!-- Просто добавь класс: -->
  <div class="glass" style="padding:2rem">Обычное стекло</div>
  <div class="glass glass--lens glass--live" style="padding:2rem">Сильное преломление + свет за курсором</div>
  <button class="glass glass--round" style="padding:1rem 2rem;border:0;font:inherit;color:inherit;cursor:pointer">Стеклянная кнопка</button>
</body>
</html>
